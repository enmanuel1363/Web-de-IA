{% extends 'base.html' %}

{% block titulo %} CONTACTOS {% endblock titulo %}

{% block body %}
<div class="container mt-5 p-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-lg">
                <div class="card-header bg-primary text-white text-center">
                    <h3>Formulario de Contacto</h3>
                </div>
                <div class="card-body">

                    {% if user %}

                        <div class="card mb-4 border-success">
                            <div class="card-header bg-success text-white">
                                <strong>Datos enviados</strong>
                            </div>
                            <ul class="list-group list-group-flush">
                                <li class="list-group-item"><b>Nombre:</b> {{ user.nombre }}</li>
                                <li class="list-group-item"><b>Email:</b> {{ user.email }}</li>
                                <li class="list-group-item"><b>Mensaje:</b> {{ user.mensaje }}</li>
                            </ul>
                        </div>
                    {% endif %}

                    <form action="" method="post">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre:</label>
                            <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Tu nombre"
                                   data-bs-toggle="tooltip" 
                                   data-bs-placement="top" 
                                   data-bs-title="Ingresa tu nombre completo. Mínimo 2 caracteres, máximo 50 caracteres">
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email:</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="ejemplo@correo.com"
                                   data-bs-toggle="tooltip" 
                                   data-bs-placement="top" 
                                   data-bs-title="Ingresa tu dirección de email válida. Ejemplo: usuario@dominio.com">
                        </div>

                        <div class="mb-3">
                            <label for="mensaje" class="form-label">Mensaje:</label>
                            <textarea class="form-control" id="mensaje" name="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..."
                                      data-bs-toggle="tooltip" 
                                      data-bs-placement="top" 
                                      data-bs-title="Describe detalladamente tu consulta, sugerencia o comentario. Mínimo 10 caracteres, máximo 500 caracteres"></textarea>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">
                                Enviar
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<!-- Script para inicializar los tooltips -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Inicializar todos los tooltips
    var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
    var tooltipList = tooltipTriggerList.map(function(tooltipTriggerEl) {
        return new bootstrap.Tooltip(tooltipTriggerEl, {
            trigger: 'hover focus',
            delay: { "show": 500, "hide": 100 },
            placement: 'top'
        });
    });
});
</script>
{% endblock %}
