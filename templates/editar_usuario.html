{% extends "badmin.html" %}

{% block Titulo %}
<title>Editar Usuario</title>
{% endblock Titulo %}

{% block body %}
<div class="container">
    <h1 class="mt-5 text-center">Editar Usuario</h1>
    <form action="{{ url_for('editar_usuario', id=usuario.id) }}" method="POST" class="mt-3">
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" name="nombre" value="{{ usuario.nombre }}"
                   data-bs-toggle="tooltip" 
                   data-bs-placement="top" 
                   data-bs-title="Modifica el nombre completo del usuario. Mínimo 2 caracteres, máximo 50 caracteres">
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Correo</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ usuario.email }}"
                   data-bs-toggle="tooltip" 
                   data-bs-placement="top" 
                   data-bs-title="Actualiza la dirección de email del usuario. Debe ser un formato válido: usuario@dominio.com">
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="text" class="form-control" id="password" name="password" value="{{ usuario.password }}"
                   data-bs-toggle="tooltip" 
                   data-bs-placement="top" 
                   data-bs-title="Actualiza la contraseña del usuario. Se recomienda una contraseña segura con mínimo 8 caracteres, incluyendo mayúsculas, minúsculas y números">
        </div>
        <button type="submit" class="btn btn-guardar btn-primary">Guardar Cambios</button>
        <a href="{{ url_for('listar_usuarios') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>

<!-- Script para inicializar los tooltips -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Inicializar todos los tooltips
    var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
    var tooltipList = tooltipTriggerList.map(function(tooltipTriggerEl) {
        return new bootstrap.Tooltip(tooltipTriggerEl, {
            trigger: 'hover focus',
            delay: { "show": 500, "hide": 100 },
            placement: 'top'
        });
    });

    const saveButtons = document.querySelectorAll('.btn-guardar');
    saveButtons.forEach(button => {
        button.addEventListener('click', function (e) {
            e.preventDefault(); // Evita la redirección inmediata
            const form = this.closest('form');
            
            Swal.fire({
                title: '¿Está seguro que desea guardar los cambios de este usuario?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Sí, editar',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    form.submit(); // Envía el formulario si se confirma
                }
            });
        });
    });
});
</script>

{% endblock body %}
